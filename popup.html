<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netflix Daily Pause</title><link rel="stylesheet" href="popup.css"></head>
<body><header><h1>Netflix Daily Pause</h1><p>Your viewing, on your terms.</p></header>
<main><section aria-label="Today"><div class="totals"><div><strong id="episodes">—</strong><span>episodes today</span></div><div><strong id="minutes">—</strong><span>minutes played</span></div></div><p id="allowance" class="muted"></p></section>
<form id="settings"><div class="fields"><label>Daily episode limit<input id="episode-limit" type="number" min="1" max="100" required></label><label>Daily minute limit<input id="minute-limit" type="number" min="1" max="1440" required></label></div><label>My reason to stop <span class="muted">(optional)</span><input id="reason" maxlength="240" placeholder="I want to wake up rested."></label><label class="check"><input id="diagnostic" type="checkbox"> Enable detector diagnostics</label><button type="submit">Save settings</button><p id="status" role="status"></p></form>
<button type="button" id="open-guide" class="secondary">Open settings &amp; guide</button><section><h2>Today’s episode log</h2><ul id="log"></ul></section><details id="diagnostics" hidden><summary>Latest detector observation</summary><pre id="observation">Enable diagnostics, then play Netflix.</pre></details><footer>Stored on this device · Resets at local midnight</footer></main><script src="engine.js"></script><script src="ui.js"></script><script src="popup.js"></script></body></html>
